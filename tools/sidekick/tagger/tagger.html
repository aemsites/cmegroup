<!DOCTYPE html>
<html>
  <!--
    Modified version of the adobe blog tagger, 
    found at https://github.com/adobe/blog/blob/main/tools/tagger/index.html
-->

  <head>
    <title>CME Group - Taxonomy Tagger</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="/tools/sidekick/tagger/tagger.css" />
  </head>
  <body>
    <main>
      <div class="filter">
        <h1>CME Group - Taxonomy Tagger</h1>
        <div class="instructions">
          <p>Use this page to pick the tags for your page.</p>
          <p>
            Once you click on a tag, it will populate at the bottom of the page.
            When you have picked all the tags, click "copy" and then paste the
            information directly in your page.
          </p>
        </div>
        <input type="text" id="search" placeholder="Type to filter tags..." autocomplete="off" />
      </div>

      <div id="results">
        <!-- Dynamic content will be inserted here -->
      </div>

      <div id="selected" class="hidden">
        <div class="selected-tags"></div>
        <div class="button-group">
          <button class="copy">Copy</button>
          <button class="clear">Clear</button>
        </div>
        <textarea id="copybuffer" class="hidden"></textarea>
      </div>
    </main>

    <script src="/tools/sidekick/tagger/tagger.js" type="module"></script>
    <script>
      function getCurrentDateTimeWithTimezone() {
        const options = {
          year: 'numeric',
          month: 'long',
          day: 'numeric',
          hour: '2-digit',
          minute: '2-digit',
          second: '2-digit',
          timeZoneName: 'short'
        };
        const date = new Date();
        return date.toLocaleString('en-US', options).replace(/ at/, ',');
      }

      document.addEventListener("DOMContentLoaded", function() {
        const dateTimeElement = document.querySelector(".date-time");
        dateTimeElement.textContent = getCurrentDateTimeWithTimezone();
      });
    </script>
  </body>
</html>
