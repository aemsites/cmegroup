<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>File Organiser</title>
  <link rel="stylesheet" href="/tools/organiser/organiser.css">
</head>
<body>
  <div class="organiser-container">
    <header class="organiser-header">
      <h1 class="organiser-title">File Organiser</h1>
    </header>
    
    <div class="organiser-path" id="current-path">Loading path...</div>

    <div class="organiser-search">
      <input type="text" id="search-input" placeholder="Search files...">
    </div>

    <div class="organiser-controls">
      <button class="organiser-button" id="refresh-button">Refresh</button>
      <button class="organiser-button secondary" id="cancel-button" style="display: none;">Cancel</button>
      
      <div class="organiser-format-selector">
        <label for="format-select">Format:</label>
        <select id="format-select">
          <option value="comma">Comma separated</option>
          <option value="list">List (one per line)</option>
          <option value="path">Full paths</option>
        </select>
      </div>
      
      <button class="organiser-button" id="copy-button">Copy Order</button>
    </div>

    <div class="organiser-file-list" id="file-list">
      <div class="organiser-loading">Loading files and folders...</div>
    </div>
  </div>

  <div class="organiser-copy-success" id="copy-success">Copied to clipboard!</div>

  <script type="module" src="/tools/organiser/organiser.js"></script>
</body>
</html>
